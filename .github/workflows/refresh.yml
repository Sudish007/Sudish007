name: refresh cards
on:
  workflow_dispatch: {}
  schedule:
    - cron: "43 2 * * *"   # 02:43 UTC = 08:13 IST daily; GitHub may delay or skip scheduled runs
permissions:
  contents: write
concurrency:
  group: refresh-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -t scripts -v
      - id: gen
        run: python scripts/refresh_cards.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: Sudish007
      - name: commit if changed
        env:
          STAMP: ${{ steps.gen.outputs.stamp }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "cards: refresh $STAMP"
          git push origin "HEAD:$BRANCH"
